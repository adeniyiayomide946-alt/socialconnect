<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SocialConnect</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0d1020;
    color: white;
}

header {
    background: #171b32;
    padding: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
}

.logo {
    color: #9b7cff;
    font-size: 23px;
    font-weight: bold;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #7958ff;
    color: white;
}

.secondary {
    background: #282d48;
    color: white;
}

.container {
    max-width: 700px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: #171b32;
    padding: 18px;
    border-radius: 13px;
    margin-bottom: 18px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    background: #252a45;
    color: white;
    border: 1px solid #414766;
    border-radius: 8px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.user {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.user img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
}

.post {
    background: #202540;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
}

.post p {
    margin: 12px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.actions button {
    background: #343b60;
    color: white;
}

.comment {
    background: #171b32;
    padding: 9px;
    margin-top: 8px;
    border-radius: 7px;
    font-size: 14px;
}

.hidden {
    display: none;
}

#message {
    text-align: center;
    color: #b9a7ff;
    margin: 15px;
}

small {
    color: #aab0ce;
}

h2, h3 {
    margin-bottom: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">SocialConnect</div>
    <button id="loginBtn" class="primary">
        Continue with Google
    </button>
    <button id="logoutBtn" class="secondary hidden">
        Logout
    </button>
</header>

<div id="message">Welcome to SocialConnect</div>

<main class="container">

    <section id="profileSection" class="card hidden">
        <h2>Your Profile</h2>

        <div class="user">
            <img id="profilePicture" src="https://placehold.co/80">
            <div>
                <h3 id="profileName">User</h3>
                <small id="profileEmail"></small>
            </div>
        </div>

        <input id="username" placeholder="Choose a username">

        <textarea id="bio"
        placeholder="Write something about yourself"></textarea>

        <button class="primary" id="saveProfile">
            Save Profile
        </button>
    </section>

    <section id="postSection" class="card hidden">
        <h2>Create a Post</h2>

        <textarea id="postText"
        placeholder="What's happening?"></textarea>

        <button class="primary" id="publishBtn">
            Publish Post
        </button>
    </section>

    <section id="feedSection" class="hidden">
        <h2>Community Feed</h2>
        <div id="posts"></div>
    </section>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    serverTimestamp,
    updateDoc,
    increment
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyBvrlr0UdIaKgWZFzWuDbMUuhvl5eeNPcE",
    authDomain: "socialconnect-81784.firebaseapp.com",
    projectId: "socialconnect-81784",
    storageBucket: "socialconnect-81784.firebasestorage.app",
    messagingSenderId: "914256941810",
    appId: "1:914256941810:web:c332a6f6ffb97995a4766b",
    measurementId: "G-2KCDW560FL"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

let currentUser = null;


// GOOGLE LOGIN

document.getElementById("loginBtn")
.addEventListener("click", async () => {

    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        alert("Login failed: " + error.message);
    }

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try {
        await signOut(auth);
    } catch (error) {
        alert(error.message);
    }

});


// AUTHENTICATION CHECK

onAuthStateChanged(auth, async (user) => {

    currentUser = user;

    const sections = [
        "profileSection",
        "postSection",
        "feedSection"
    ];

    if (user) {

        document.getElementById("loginBtn")
        .classList.add("hidden");

        document.getElementById("logoutBtn")
        .classList.remove("hidden");

        sections.forEach(id =>
            document.getElementById(id)
            .classList.remove("hidden")
        );

        document.getElementById("profilePicture").src =
            user.photoURL || "https://placehold.co/80";

        document.getElementById("profileName").textContent =
            user.displayName || "User";

        document.getElementById("profileEmail").textContent =
            user.email || "";

        document.getElementById("message").textContent =
            "Welcome, " + (user.displayName || "User");

        await loadProfile();
        await loadPosts();

    } else {

        document.getElementById("loginBtn")
        .classList.remove("hidden");

        document.getElementById("logoutBtn")
        .classList.add("hidden");

        sections.forEach(id =>
            document.getElementById(id)
            .classList.add("hidden")
        );

        document.getElementById("message").textContent =
            "Sign in to join SocialConnect.";

    }

});


// LOAD PROFILE

async function loadProfile() {

    try {

        const ref = doc(db, "users", currentUser.uid);
        const snap = await getDoc(ref);

        if (snap.exists()) {

            const data = snap.data();

            document.getElementById("username").value =
                data.username || "";

            document.getElementById("bio").value =
                data.bio || "";

        }

    } catch (error) {
        console.error(error);
    }

}


// SAVE PROFILE

document.getElementById("saveProfile")
.addEventListener("click", async () => {

    const username =
        document.getElementById("username").value.trim();

    const bio =
        document.getElementById("bio").value.trim();

    if (!username) {
        alert("Please choose a username.");
        return;
    }

    try {

        await setDoc(doc(db, "users", currentUser.uid), {

            username: username,
            bio: bio,
            email: currentUser.email,
            photo: currentUser.photoURL || "",
            updatedAt: serverTimestamp()

        }, { merge: true });

        alert("Profile saved!");

    } catch (error) {
        alert(error.message);
    }

});


// CREATE POST

document.getElementById("publishBtn")
.addEventListener("click", async () => {

    const text =
        document.getElementById("postText").value.trim();

    if (!text) {
        alert("Write something first.");
        return;
    }

    try {

        const profile = await getDoc(
            doc(db, "users", currentUser.uid)
        );

        const data = profile.exists()
            ? profile.data()
            : {};

        await addDoc(collection(db, "posts"), {

            text: text,
            uid: currentUser.uid,
            username: data.username ||
                currentUser.displayName || "User",
            photo: currentUser.photoURL || "",
            likes: 0,
            createdAt: serverTimestamp()

        });

        document.getElementById("postText").value = "";

        await loadPosts();

    } catch (error) {
        alert(error.message);
    }

});


// LOAD POSTS

async function loadPosts() {

    const container = document.getElementById("posts");

    container.innerHTML = "Loading posts...";

    try {

        const q = query(
            collection(db, "posts"),
            orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(q);

        container.innerHTML = "";

        if (snapshot.empty) {
            container.textContent =
                "No posts yet. Be the first!";
            return;
        }

        snapshot.forEach(postDoc => {

            const post = postDoc.data();
            const postId = postDoc.id;

            const card = document.createElement("div");
            card.className = "post";

            const user = document.createElement("div");
            user.className = "user";

            const image = document.createElement("img");
            image.src = post.photo || "https://placehold.co/80";

            const name = document.createElement("strong");
            name.textContent = post.username || "User";

            user.append(image, name);

            const content = document.createElement("p");
            content.textContent = post.text || "";

            const count = document.createElement("span");
            count.textContent = (post.likes || 0) + " likes";

            const actions = document.createElement("div");
            actions.className = "actions";

            const like = document.createElement("button");
            like.textContent = "👍 Like";

            like.onclick = () => likePost(postId);

            const commentButton = document.createElement("button");
            commentButton.textContent = "💬 Comments";

            const commentArea = document.createElement("div");
            commentArea.className = "hidden";

            const input = document.createElement("input");
            input.placeholder = "Write a comment...";

            const send = document.createElement("button");
            send.className = "primary";
            send.textContent = "Send";

            const comments = document.createElement("div");

            send.onclick = async () => {

                const text = input.value.trim();

                if (!text) return;

                try {

                    await addDoc(
                        collection(db, "posts", postId, "comments"),
                        {
                            text: text,
                            uid: currentUser.uid,
                            username: currentUser.displayName || "User",
                            createdAt: serverTimestamp()
                        }
                    );

                    input.value = "";

                    await loadComments(postId, comments);

                } catch (error) {
                    alert(error.message);
                }

            };

            commentButton.onclick = async () => {

                commentArea.classList.toggle("hidden");

                if (!commentArea.classList.contains("hidden")) {
                    await loadComments(postId, comments);
                }

            };

            actions.append(like, commentButton);

            commentArea.append(input, send, comments);

            card.append(
                user,
                content,
                count,
                actions,
                commentArea
            );

            container.append(card);

        });

    } catch (error) {
        container.textContent = error.message;
    }

}


// LIKE POSTS

async function likePost(postId) {

    try {

        const likeRef = doc(
            db,
            "posts",
            postId,
            "likes",
            currentUser.uid
        );

        const existing = await getDoc(likeRef);

        if (existing.exists()) {
            alert("You already liked this post.");
            return;
        }

        await setDoc(likeRef, {
            uid: currentUser.uid
        });

        await updateDoc(doc(db, "posts", postId), {
            likes: increment(1)
        });

        await loadPosts();

    } catch (error) {
        alert(error.message);
    }

}


// LOAD COMMENTS

async function loadComments(postId, container) {

    container.innerHTML = "Loading comments...";

    try {

        const q = query(
            collection(db, "posts", postId, "comments"),
            orderBy("createdAt", "asc")
        );

        const snapshot = await getDocs(q);

        container.innerHTML = "";

        if (snapshot.empty) {
            container.textContent = "No comments yet.";
            return;
        }

        snapshot.forEach(commentDoc => {

            const comment = commentDoc.data();

            const item = document.createElement("div");
            item.className = "comment";

            const name = document.createElement("strong");
            name.textContent =
                (comment.username || "User") + ": ";

            const text = document.createElement("span");
            text.textContent = comment.text || "";

            item.append(name, text);

            container.append(item);

        });

    } catch (error) {
        container.textContent = error.message;
    }

}

</script>

</body>
                </html>
