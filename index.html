<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google-site-verification" content="JwBstM5rG6Tng6XWfpJjaGRcQCNe1ECMOlhptUCTnTA">
  <meta name="theme-color" content="#101326">
  <title>SocialConnect — Meet. Share. Connect.</title>
  <style>
    :root{--bg:#0d1020;--panel:#171b32;--panel2:#202641;--line:#303858;--text:#f5f6ff;--muted:#aeb5d2;--accent:#8b70ff;--accent2:#6b4cf6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Arial,sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700}
    .primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}.quiet{background:#303858;color:white}
    header{position:sticky;top:0;z-index:5;background:#14182dee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .bar{max-width:1050px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#b5a5ff}.brand span{color:white}
    .wrap{max-width:760px;margin:28px auto;padding:0 15px}
    .welcome{text-align:center;padding:32px 18px}.welcome h1{font-size:clamp(28px,6vw,42px);margin:0 0 8px}.welcome p,.muted{color:var(--muted)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0002}
    h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0}
    input,textarea{width:100%;background:#10152a;border:1px solid var(--line);border-radius:10px;color:white;padding:12px;margin:7px 0;outline:none}
    input:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:95px;resize:vertical}
    .profile{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#343858}
    .posthead{display:flex;align-items:center;gap:10px}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;margin:15px 0}
    .postactions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
    .commentbox{display:flex;gap:8px;align-items:center}.commentbox input{margin:8px 0}
    .comment{background:var(--panel2);padding:9px 11px;border-radius:9px;margin-top:8px;overflow-wrap:anywhere}
    .hidden{display:none!important}.status{text-align:center;color:#c5b9ff;margin:12px 0}.small{font-size:13px;color:var(--muted)}
    .row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}
    footer{text-align:center;color:var(--muted);padding:25px;font-size:13px}
    @media(max-width:520px){.bar{padding:11px 13px}.brand{font-size:19px}.wrap{margin:15px auto}.panel{padding:14px}}
  </style>
</head>
<body>
<header><div class="bar"><div class="brand">Social<span>Connect</span></div><div class="row" style="flex:0 0 auto">
  <button id="loginBtn" class="primary">Continue with Google</button>
  <button id="logoutBtn" class="quiet hidden">Log out</button>
</div></div></header>

<main class="wrap">
  <section id="signedOut" class="panel welcome">
    <h1>Meet. Share. Connect.</h1>
    <p>A place to share what’s happening and connect with your community.</p>
    <p><button id="welcomeLogin" class="primary">Sign in with Google</button></p>
    <p class="small">Sign in to create a profile, publish posts, like and comment.</p>
  </section>

  <div id="appArea" class="hidden">
    <div id="status" class="status" role="status"></div>
    <section class="panel">
      <h2>Your profile</h2>
      <div class="profile">
        <img id="myPhoto" class="avatar" alt="Your profile photo" src="https://placehold.co/96x96?text=SC">
        <div><h3 id="myName">Member</h3><div id="myEmail" class="small"></div></div>
      </div>
      <input id="username" maxlength="30" placeholder="Username">
      <textarea id="bio" maxlength="160" placeholder="A short bio (up to 160 characters)"></textarea>
      <button id="saveProfile" class="quiet">Save profile</button>
    </section>

    <section class="panel">
      <h2>Create a post</h2>
      <textarea id="postText" maxlength="2000" placeholder="What's happening?"></textarea>
      <div class="row"><button id="publishBtn" class="primary">Publish post</button></div>
    </section>

    <section>
      <h2 style="margin:0 0 12px 3px">Community feed</h2>
      <div id="feed"><div class="panel muted">Loading posts…</div></div>
    </section>
  </div>
</main>
<footer>SocialConnect · Be kind. Keep it respectful.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, query, orderBy, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Your Firebase web-app configuration
const firebaseConfig = {
  apiKey: "AIzaSyBvrlr0UdIaKgWZFzWuDbMUuhvl5eeNPcE",
  authDomain: "socialconnect-81784.firebaseapp.com",
  projectId: "socialconnect-81784",
  storageBucket: "socialconnect-81784.firebasestorage.app",
  messagingSenderId: "914256941810",
  appId: "1:914256941810:web:c332a6f6ffb97995a4766b",
  measurementId: "G-2KCDW560FL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;

const $ = id => document.getElementById(id);
function setStatus(text){ $("status").textContent = text || ""; }

async function login(){
  try { await signInWithPopup(auth, provider); }
  catch(e){ alert("Google sign-in failed: " + e.message); }
}
$("loginBtn").addEventListener("click", login);
$("welcomeLogin").addEventListener("click", login);
$("logoutBtn").addEventListener("click", async()=>{try{await signOut(auth)}catch(e){alert(e.message)}});

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  $("signedOut").classList.toggle("hidden", !!user);
  $("appArea").classList.toggle("hidden", !user);
  $("loginBtn").classList.toggle("hidden", !!user);
  $("logoutBtn").classList.toggle("hidden", !user);
  if(!user) return;
  $("myPhoto").src = user.photoURL || "https://placehold.co/96x96?text=SC";
  $("myName").textContent = user.displayName || "Member";
  $("myEmail").textContent = user.email || "";
  await loadProfile();
  await loadFeed();
});

async function loadProfile(){
  try{
    const snap = await getDoc(doc(db,"users",currentUser.uid));
    const data = snap.exists() ? snap.data() : {};
    $("username").value = data.username || currentUser.displayName || "";
    $("bio").value = data.bio || "";
  }catch(e){setStatus("Could not load profile: "+e.message)}
}
$("saveProfile").addEventListener("click", async()=>{
  const username = $("username").value.trim();
  const bio = $("bio").value.trim();
  if(!username){alert("Please enter a username.");return}
  try{
    await setDoc(doc(db,"users",currentUser.uid),{
      username,bio,email:currentUser.email || "",photo:currentUser.photoURL || "",
      updatedAt:serverTimestamp()
    },{merge:true});
    setStatus("Profile saved.");
  }catch(e){setStatus("Could not save profile: "+e.message)}
});

$("publishBtn").addEventListener("click", async()=>{
  const text = $("postText").value.trim();
  if(!text){alert("Write something first.");return}
  if(text.length>2000){alert("Your post is too long.");return}
  try{
    const profile = await getDoc(doc(db,"users",currentUser.uid));
    const p = profile.exists()?profile.data():{};
    await addDoc(collection(db,"posts"),{
      text,uid:currentUser.uid,
      username:p.username || currentUser.displayName || "Member",
      photo:currentUser.photoURL || "",createdAt:serverTimestamp()
    });
    $("postText").value="";
    setStatus("Your post was published.");
    await loadFeed();
  }catch(e){setStatus("Could not publish: "+e.message)}
});

async function loadFeed(){
  const feed = $("feed");
  feed.innerHTML = '<div class="panel muted">Loading posts…</div>';
  try{
    const q = query(collection(db,"posts"),orderBy("createdAt","desc"),limit(50));
    const snap = await getDocs(q);
    feed.innerHTML="";
    if(snap.empty){feed.innerHTML='<div class="panel muted">No posts yet. Be the first to share something!</div>';return}
    for(const postSnap of snap.docs){
      const p=postSnap.data(), id=postSnap.id;
      const card=document.createElement("article");card.className="panel";
      const head=document.createElement("div");head.className="posthead";
      const img=document.createElement("img");img.className="avatar";img.alt="Profile photo";img.src=p.photo||"https://placehold.co/96x96?text=SC";
      const identity=document.createElement("div");
      const name=document.createElement("h3");name.textContent=p.username||"Member";
      const when=document.createElement("div");when.className="small";
      when.textContent=p.createdAt?.toDate ? p.createdAt.toDate().toLocaleString() : "Just posted";
      identity.append(name,when);head.append(img,identity);
      const body=document.createElement("div");body.className="postbody";body.textContent=p.text||"";
      const actions=document.createElement("div");actions.className="postactions";
      const likeBtn=document.createElement("button");likeBtn.className="quiet";likeBtn.textContent="♡ Like";
      const likeCount=document.createElement("span");likeCount.className="small";likeCount.textContent="Loading likes…";
      const commentsWrap=document.createElement("div");commentsWrap.style.marginTop="12px";
      const commentToggle=document.createElement("button");commentToggle.className="quiet";commentToggle.textContent="Show comments";
      const commentArea=document.createElement("div");commentArea.className="hidden";
      const commentList=document.createElement("div");
      const commentForm=document.createElement("div");commentForm.className="commentbox";
      const commentInput=document.createElement("input");commentInput.maxLength=500;commentInput.placeholder="Write a comment…";
      const send=document.createElement("button");send.className="primary";send.textContent="Send";
      commentForm.append(commentInput,send);commentArea.append(commentForm,commentList);
      actions.append(likeBtn,likeCount,commentToggle);
      card.append(head,body,actions,commentsWrap);commentsWrap.append(commentArea);feed.append(card);

      const likesRef=collection(db,"posts",id,"likes");
      async function refreshLikes(){
        const likes=await getDocs(likesRef);
        likeCount.textContent=likes.size+" likes";
        likeBtn.textContent=likes.docs.some(d=>d.id===currentUser.uid)?"♥ Liked":"♡ Like";
      }
      await refreshLikes();
      likeBtn.addEventListener("click",async()=>{
        const likeRef=doc(db,"posts",id,"likes",currentUser.uid);
        try{
          const existing=await getDoc(likeRef);
          if(existing.exists()) await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js").then(m=>m.deleteDoc(likeRef));
          else await setDoc(likeRef,{uid:currentUser.uid,createdAt:serverTimestamp()});
          await refreshLikes();
        }catch(e){alert("Could not update like: "+e.message)}
      });
      async function refreshComments(){
        commentList.innerHTML='<div class="small">Loading comments…</div>';
        try{
          const cq=query(collection(db,"posts",id,"comments"),orderBy("createdAt","asc"),limit(100));
          const cs=await getDocs(cq);commentList.innerHTML="";
          if(cs.empty){commentList.innerHTML='<div class="small">No comments yet.</div>';return}
          cs.forEach(c=>{
            const d=c.data(), el=document.createElement("div");el.className="comment";
            const b=document.createElement("strong");b.textContent=(d.username||"Member")+": ";
            const t=document.createElement("span");t.textContent=d.text||"";
            el.append(b,t);commentList.append(el);
          });
        }catch(e){commentList.textContent="Could not load comments: "+e.message}
      }
      commentToggle.addEventListener("click",async()=>{
        commentArea.classList.toggle("hidden");
        if(!commentArea.classList.contains("hidden")){commentToggle.textContent="Hide comments";await refreshComments()}
        else commentToggle.textContent="Show comments";
      });
      send.addEventListener("click",async()=>{
        const text=commentInput.value.trim();if(!text)return;
        try{
          const profile=await getDoc(doc(db,"users",currentUser.uid));
          const u=profile.exists()?profile.data():{};
          await addDoc(collection(db,"posts",id,"comments"),{
            text,uid:currentUser.uid,username:u.username||currentUser.displayName||"Member",
            createdAt:serverTimestamp()
          });
          commentInput.value="";await refreshComments();
        }catch(e){alert("Could not send comment: "+e.message)}
      });
    }
  }catch(e){feed.innerHTML='<div class="panel">Could not load posts: '+escapeHtml(e.message)+'</div>'}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body>
</html>
